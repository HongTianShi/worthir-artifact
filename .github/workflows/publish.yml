name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-zh-cn')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Read the package version
        id: package
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the public PyPI package
        run: |
          python -m venv "$RUNNER_TEMP/worthir-pypi-env"
          for attempt in 1 2 3 4 5 6; do
            if "$RUNNER_TEMP/worthir-pypi-env/bin/python" -m pip install \
              --disable-pip-version-check --no-cache-dir \
              --index-url https://pypi.org/simple \
              "worthir-eval==${{ steps.package.outputs.version }}"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done
          "$RUNNER_TEMP/worthir-pypi-env/bin/python" -m pip check
      - name: Run the installed package outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/worthir-pypi-work"
          cd "$RUNNER_TEMP/worthir-pypi-work"
          "$RUNNER_TEMP/worthir-pypi-env/bin/worthir" doctor
          "$RUNNER_TEMP/worthir-pypi-env/bin/worthir" demo-custom
          "$RUNNER_TEMP/worthir-pypi-env/bin/worthir" analyze reproduced/custom_task
          "$RUNNER_TEMP/worthir-pypi-env/bin/worthir" sensitivity reproduced/custom_task
          "$RUNNER_TEMP/worthir-pypi-env/bin/worthir" budget reproduced/custom_task
          "$RUNNER_TEMP/worthir-pypi-env/bin/worthir" plot reproduced/custom_task
          "$RUNNER_TEMP/worthir-pypi-env/bin/python" -m worthir doctor
