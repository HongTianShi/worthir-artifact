name: validate

on:
  push:
  pull_request:

jobs:
  framework:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python setup_environment.py
      - if: runner.os == 'Windows'
        run: .\worthir.cmd demo
      - if: runner.os != 'Windows'
        run: ./worthir demo
      - if: matrix.python == '3.13'
        run: |
          python worthir.py demo-custom
          python examples/python_api/example.py reproduced/custom_task
          python paper_results/full_replay/replay.py --help
          python -m py_compile paper_results/full_replay/fiqa260/adapter.py
          python paper_results/full_replay/replay.py fiqa260 prepare --workspace ci-fiqa260-prepare

  paper-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: paper_results/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check --require-hashes -r paper_results/requirements-lock.txt
      - run: python paper_results/run.py --use-current-python

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test the source archive launcher
        run: |
          mkdir -p "$RUNNER_TEMP/source-archive"
          git archive --format=zip --prefix=worthir-source/ HEAD > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source-archive"
          cd "$RUNNER_TEMP/source-archive/worthir-source"
          ./worthir demo-custom
      - name: Build and install the wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse"
          python -m venv "$RUNNER_TEMP/worthir-wheel-env"
          "$RUNNER_TEMP/worthir-wheel-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheelhouse/*.whl
      - name: Run installed commands outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/installed-work"
          cd "$RUNNER_TEMP/installed-work"
          "$RUNNER_TEMP/worthir-wheel-env/bin/worthir" doctor
          "$RUNNER_TEMP/worthir-wheel-env/bin/worthir" demo-custom | tee demo-custom.log
          grep -q '^NEXT: worthir validate-task' demo-custom.log
          "$RUNNER_TEMP/worthir-wheel-env/bin/worthir" build-trec \
            "$GITHUB_WORKSPACE/examples/trec_walkthrough/source" installed-trec \
            --task-id installed-trec-v1 --metric ndcg@3 | tee build-trec.log
          grep -q '^NEXT: worthir compare' build-trec.log
          "$RUNNER_TEMP/worthir-wheel-env/bin/worthir" init initialized-task --task-id installed-task-v1 | tee init.log
          grep -q '^NEXT: worthir validate-task' init.log
          test ! -e initialized-task/__init__.py
          test ! -d initialized-task/__pycache__
          grep -q '^worthir validate-task' initialized-task/README.md
          grep -q '^worthir validate-task' reproduced/custom_task/README.md
          grep -q '^worthir compare' installed-trec/README.md
