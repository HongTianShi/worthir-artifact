name: Report a reproducible bug
description: Report a command, installation, or task-validation failure
title: "Bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - PyPI package
        - Tagged source checkout
        - Current branch checkout
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
      description: Paste `python --version` and name the operating system.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command that failed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Complete error output
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: State which example or task files reproduce the failure. Remove private evaluator data.
    validations:
      required: true
