[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worthir-eval"
version = "1.2.0"
description = "Evaluate cost-aware query-level retrieval routing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "WorthIR authors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
worthir = "worthir:main"

[tool.setuptools]
py-modules = ["worthir"]
include-package-data = true
packages = [
  "worthir_eval",
  "worthir_eval.scripts",
  "worthir_eval.examples",
  "worthir_eval.examples.custom_router",
  "worthir_eval.examples.custom_task",
  "worthir_eval.examples.custom_task.source",
  "worthir_eval.examples.trec_walkthrough",
  "worthir_eval.examples.trec_walkthrough.source",
  "worthir_eval.examples.trec_walkthrough.source.runs",
  "worthir_eval.contracts",
  "worthir_eval.quickstart",
  "worthir_eval.quickstart.evaluator",
  "worthir_eval.quickstart.participant",
  "worthir_eval.task_template",
  "worthir_eval.task_template.contracts",
  "worthir_eval.task_template.evaluator",
  "worthir_eval.task_template.participant",
]

[tool.setuptools.package-dir]
worthir_eval = "src/worthir_eval"
"worthir_eval.scripts" = "scripts"
"worthir_eval.examples" = "examples"
"worthir_eval.examples.custom_router" = "examples/custom_router"
"worthir_eval.examples.custom_task" = "examples/custom_task"
"worthir_eval.examples.trec_walkthrough" = "examples/trec_walkthrough"
"worthir_eval.contracts" = "contracts"
"worthir_eval.quickstart" = "quickstart"
"worthir_eval.task_template" = "task_template"

[tool.setuptools.package-data]
"worthir_eval.contracts" = ["*.json", "README.md"]
"worthir_eval.examples.custom_router" = ["README.md"]
"worthir_eval.examples.custom_task" = ["README.md", "source/*"]
"worthir_eval.examples.trec_walkthrough" = ["README.md", "source/*", "source/runs/*"]
"worthir_eval.quickstart" = ["README.md", "participant/*", "evaluator/*"]
"worthir_eval.task_template" = ["README.md", ".gitignore", "contracts/*", "participant/*", "evaluator/*"]
